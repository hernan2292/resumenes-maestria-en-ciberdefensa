server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras básicas también del lado del cliente (el grueso de la
    # política de seguridad HTTP vive en el servidor Go — ver adenda punto
    # 5 — pero no cuesta nada reforzarlas también acá).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # SPA: cualquier ruta que no sea un archivo estático existente cae a
    # index.html para que react-router-dom maneje el enrutamiento del lado
    # del cliente (/patient, /doctor, etc. no son rutas del servidor).
    location / {
        try_files $uri /index.html;
    }
}
